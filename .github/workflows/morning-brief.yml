name: Morning Market Brief

on:
  schedule:
    # GitHub often starts scheduled jobs late (sometimes 30-60 min), so try 3 times:
    # 02:50, 03:05, 03:20 UTC = 8:20, 8:35, 8:50 AM IST. Only the first one posts.
    - cron: "50 2 * * *"
    - cron: "5 3 * * *"
    - cron: "20 3 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual test (always posts)

permissions:
  contents: write   # to save the images in the repo (Instagram needs a public URL)

concurrency:
  group: morning-brief    # runs wait for each other, so the "already posted" check works
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest commit, so a queued run sees today's images from an earlier run

      - name: Already posted today?
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "stories/$TODAY-story.jpg" ]; then
            echo "Already posted today - skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
        if: env.SKIP != '1'

      - name: Build brief, send to Telegram
        if: env.SKIP != '1'
        run: python market_brief.py

      - name: Save images to repo (keep last 7)
        if: always() && env.SKIP != '1'
        run: |
          ls stories/*.jpg 2>/dev/null | sort | head -n -7 | xargs -r git rm -q --ignore-unmatch
          ls stories/*.jpg 2>/dev/null | sort | head -n -7 | xargs -r rm -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/
          git commit -m "Images $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          git push

      - name: Post Instagram story + photo
        if: always() && env.SKIP != '1'
        run: python market_brief.py --publish-ig
