name: Morning Market Brief

on:
  schedule:
    # 03:15 UTC = 8:45 AM IST. GitHub often starts scheduled jobs 5-15 min late,
    # so everything is posted around 8:50-9:05 AM.
    - cron: "15 3 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual test

permissions:
  contents: write   # to save the story image in the repo (Instagram needs a public URL)

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0

      - name: Build brief, send to Telegram
        run: python market_brief.py

      - name: Save story image to repo (keep last 7)
        if: always()
        run: |
          ls stories/*.jpg 2>/dev/null | sort | head -n -7 | xargs -r git rm -q --ignore-unmatch
          ls stories/*.jpg 2>/dev/null | sort | head -n -7 | xargs -r rm -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/
          git commit -m "Story image $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Post Instagram story
        if: always()
        run: python market_brief.py --publish-ig
