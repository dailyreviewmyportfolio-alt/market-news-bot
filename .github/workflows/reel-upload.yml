name: Evening Reel Upload

on:
  schedule:
    # Mon-Fri. 12:45 and 13:10 UTC = 6:15 and 6:40 PM IST. GitHub often starts scheduled jobs late,
    # so the script itself waits until exactly 7:00 PM IST before posting (two runs = a backup).
    - cron: "45 12 * * 1-5"
    - cron: "10 13 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button: posts right away (for a test)

permissions:
  contents: write   # only used by the fallback that briefly puts the video in the repo

concurrency:
  group: reel-upload    # the second run waits for the first, so the video is never posted twice
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for 7:00 PM IST, then post the Reel
        run: python reel_upload.py ${{ github.event_name == 'schedule' && '--wait' || '--now' }}
